        tag: variant
    time: O(m·n)
    space: O(m·n)
    cost_note: One O(1) step per cell; the walk back adds O(m + n). The one-row version needs O(n) memory but cannot rebuild the string.
    variants:
      - "Edit distance also allows a replace: the mismatch case becomes `1 + min` of three neighbours ([[edit-distance]])."
      - "Longest common substring (maximum length of repeated subarray): on a mismatch the cell is 0, not a max, and the answer is the largest cell."
      - "Longest palindromic subsequence is the LCS of s and its reverse, though the interval form is more usual ([[palindrome-dp]])."
      - "Minimum ASCII delete sum: the same table, but it stores the largest ASCII total kept instead of a length."
    traps:
      - "Checking the neighbours before the match in the walk back: for `\"a\"` and `\"a\"`, `dp[0][1] >= dp[1][0]` moves up and the LCS comes out empty."
      - "The one-row version with `row[j] + 1` on a match reads the new row, not the diagonal: `[1]` and `[1, 1]` gives 2 instead of 1."
      - "The supersequence walk without the two leftover loops drops the rest of one string: `\"abac\"`, `\"cab\"` gives \"abac\", which does not contain \"cab\"."
    practice: [longest-common-subsequence, delete-operation-for-two-strings, uncrossed-lines, maximum-length-of-repeated-subarray, shortest-common-supersequence]
