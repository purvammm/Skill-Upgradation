    time: O(2^(n/2)·n)
    space: O(2^(n/2))
    cost_note: Each half has 2^(n/2) sums, and sorting them adds the factor n; for n = 40 that is about 10⁶ sums per half.
    variants:
      - "4Sum II: put every `a + b` sum of the first two arrays in a `HashMap` of counts, then look up `-(c + d)`. Same split, with hashing instead of sorting."
      - "Count subsets with sum ≤ X: sort the right sums, and for each left sum x add the number of right sums ≤ X − x ([[lower-bound]])."
      - "Split array with same average: a group of size k works if its sum is `k · total / len`. Group the half sums by count and look for a left sum of k₁ numbers and a right sum of k − k₁ numbers that add up to it."
    traps:
      - "Storing the sums in `int`: 20 values of 10⁹ overflow. Use `long`."
      - "Pairing any left sum with any right sum in the equal-size version ignores the size rule; k from the left needs exactly n − k from the right."
      - "Building 2²⁰ boxed `Long` values is slow and memory-heavy; keep `long[]` when you do not need the groups (the grouped version can afford lists because 2n ≤ 30)."
