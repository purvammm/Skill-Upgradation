<head>

<title>DSA Solo Leveling — 60-Day Java Hunter System</title>

<style>
:root{
  --bg:#040912; --bg2:#081324; --panel:rgba(9,22,44,.86); --panel2:rgba(14,32,62,.75);
  --line:rgba(84,170,255,.38); --line-soft:rgba(84,170,255,.16);
  --glow:#4fb3ff; --glow2:#8fd3ff; --text:#dbe8f7; --dim:#8ea3bd; --faint:#5d728c;
  --ok:#3ee59a; --warn:#ffb547; --bad:#ff5468; --violet:#a78bfa;
  --E:#9aa4b2; --D:#4ade80; --C:#38bdf8; --B:#a78bfa; --A:#fb923c; --S:#f43f5e;
  --head:'Rajdhani','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;min-height:100vh;
  background-image:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(60,140,255,.16),transparent 70%),
  radial-gradient(ellipse 50% 40% at 100% 100%,rgba(120,80,255,.08),transparent 70%);background-attachment:fixed}
a{color:var(--glow2)}
code{font-family:var(--mono);font-size:.86em;background:rgba(79,179,255,.1);border:1px solid var(--line-soft);padding:1px 5px;border-radius:4px;color:#cfe8ff}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.win{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 0 0 1px rgba(79,179,255,.06) inset,0 0 28px rgba(40,130,255,.12);position:relative}
.win-title{font-family:var(--head);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--glow2);font-size:13px;padding:10px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.win-title::before{content:"";width:8px;height:8px;border:1px solid var(--glow);transform:rotate(45deg);box-shadow:0 0 8px var(--glow)}
.win-body{padding:16px}
h1,h2,h3{font-family:var(--head);letter-spacing:.04em}
h2{font-size:26px;color:#fff;margin-bottom:6px}
h3{font-size:18px;color:var(--glow2);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.1em}
p{margin:6px 0}
ul.clean{list-style:none;padding:0}
ul.clean li{padding:4px 0 4px 20px;position:relative}
ul.clean li::before{content:"▸";position:absolute;left:2px;color:var(--glow)}
ol.steps{padding-left:22px}
ol.steps li{margin:5px 0}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

/* status */
.status{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px}
@media(max-width:860px){.status{grid-template-columns:1fr}}
.lvl{display:flex;align-items:center;gap:16px}
.lvl-num{font-family:var(--head);font-size:64px;font-weight:700;line-height:1;color:#fff;text-shadow:0 0 18px rgba(79,179,255,.75)}
.lvl-lab{font-family:var(--head);letter-spacing:.3em;color:var(--dim);font-size:12px}
.rank{display:inline-block;font-family:var(--head);font-weight:700;font-size:20px;padding:0 10px;border:1px solid currentColor;border-radius:4px;box-shadow:0 0 12px currentColor inset}
.name-in{background:transparent;border:none;border-bottom:1px dashed var(--line);color:#fff;font-family:var(--head);font-size:22px;font-weight:600;width:100%;max-width:260px;outline:none}
.bar{height:10px;background:rgba(255,255,255,.06);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2a7fff,var(--glow2));box-shadow:0 0 10px var(--glow);transition:width .4s}
.stat{display:grid;grid-template-columns:44px 1fr 56px;gap:8px;align-items:center;font-family:var(--head);font-weight:600;font-size:15px;margin:5px 0}
.stat .bar{height:7px}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding:5px 0;font-size:14px}
.kv b{font-family:var(--head);font-size:17px;color:#fff}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:rgba(4,9,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);margin:16px -18px 18px;padding:8px 18px;display:flex;gap:6px;flex-wrap:wrap}
.tabs a{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;text-decoration:none;color:var(--dim);padding:6px 12px;border:1px solid transparent;border-radius:5px}
.tabs a:hover{color:#fff;border-color:var(--line-soft)}
.tabs a.on{color:#fff;border-color:var(--line);background:rgba(79,179,255,.1);box-shadow:0 0 12px rgba(79,179,255,.2)}

/* buttons */
.btn{font-family:var(--head);font-weight:600;letter-spacing:.08em;font-size:14px;background:rgba(79,179,255,.08);color:var(--glow2);border:1px solid var(--line);border-radius:5px;padding:5px 12px;cursor:pointer;transition:.15s}
.btn:hover{background:rgba(79,179,255,.2);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ok{color:var(--ok);border-color:rgba(62,229,154,.5);background:rgba(62,229,154,.08)}
.btn.warn{color:var(--warn);border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.06)}
.btn.bad{color:var(--bad);border-color:rgba(255,84,104,.5);background:rgba(255,84,104,.06)}
.btn.big{font-size:16px;padding:8px 18px}
select,input[type=text],input[type=date],textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:6px 9px;font-family:var(--body);font-size:14px}
textarea{width:100%;min-height:64px;resize:vertical;font-family:var(--mono);font-size:13px}

/* system messages */
.sysmsg{border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,50,95,.55),rgba(8,20,40,.6));border-radius:6px;padding:14px 16px;margin:12px 0}
.sysmsg .tag{font-family:var(--head);font-weight:700;letter-spacing:.25em;color:var(--glow2);font-size:12px}
.sysmsg.penalty{border-color:rgba(255,84,104,.6);background:linear-gradient(180deg,rgba(95,20,35,.5),rgba(40,8,16,.6))}
.sysmsg.penalty .tag{color:var(--bad)}
.quest{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:15px}
.quest .done{color:var(--ok);font-family:var(--head);font-weight:700}
.quest .todo{color:var(--warn);font-family:var(--head);font-weight:700}

/* gates */
.phase{margin:22px 0 10px;font-family:var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-size:13px;border-bottom:1px solid var(--line-soft);padding-bottom:5px}
.gate{cursor:pointer;padding:14px;transition:.15s;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.gate:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(79,179,255,.25)}
.gate .gno{font-family:var(--head);letter-spacing:.2em;font-size:12px;color:var(--faint)}
.gate .gname{font-family:var(--head);font-weight:700;font-size:20px;color:#fff;line-height:1.15}
.gate .gsub{font-size:13px;color:var(--dim)}
.gate.cleared{border-color:rgba(62,229,154,.55)}
.gate.current{border-color:var(--glow);box-shadow:0 0 22px rgba(79,179,255,.35)}
.pill{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.1em;padding:1px 8px;border-radius:20px;border:1px solid currentColor;display:inline-block}

/* problems */
.prob{border:1px solid var(--line-soft);border-radius:6px;background:var(--panel2);margin:8px 0}
.prob.solved{border-color:rgba(62,229,154,.45)}
.prob-h{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap}
.chk{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--ok);font-size:16px;cursor:pointer;flex:none}
.prob.solved .chk{background:rgba(62,229,154,.15);border-color:var(--ok)}
.ptitle{flex:1;min-width:200px;font-weight:600}
.ptitle a{color:#fff;text-decoration:none}
.ptitle a:hover{color:var(--glow2);text-decoration:underline}
.pnum{font-family:var(--mono);color:var(--faint);font-size:12px;margin-right:6px}
.dE{color:var(--ok)} .dM{color:var(--warn)} .dH{color:var(--bad)}
.boss{color:var(--S);border-color:var(--S)} .side{color:var(--violet)}
.reveal{padding:0 14px 12px 48px;display:none}
.reveal.open{display:block}
.reveal .lab{font-family:var(--head);font-weight:700;letter-spacing:.15em;font-size:12px;text-transform:uppercase;margin-top:8px}
.lab.h{color:var(--glow2)} .lab.a{color:var(--warn)} .lab.j{color:var(--violet)} .lab.n{color:var(--ok)}

/* code */
pre.code{background:#020610;border:1px solid var(--line-soft);border-radius:6px;padding:14px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.55;color:#cfe0f2;position:relative;margin:8px 0}
pre.code .k{color:#ff7ab6} pre.code .t{color:#7fd8ff} pre.code .s{color:#a5e88f} pre.code .c{color:#5f7894;font-style:italic} pre.code .n{color:#ffc46b}
.codewrap{position:relative}
.codewrap .btn{position:absolute;top:8px;right:8px;font-size:12px;padding:2px 8px}

table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.t th{font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;color:var(--glow2);text-align:left;border-bottom:1px solid var(--line);padding:7px 8px}
table.t td{border-bottom:1px solid var(--line-soft);padding:7px 8px;vertical-align:top}
.scroll{overflow-x:auto}

/* quiz */
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;font-family:var(--body);font-size:15px;letter-spacing:0}
.qopt.right{border-color:var(--ok);color:var(--ok);background:rgba(62,229,154,.1)}
.qopt.wrong{border-color:var(--bad);color:var(--bad);background:rgba(255,84,104,.08)}

/* overlay + toast */
.overlay{position:fixed;inset:0;background:rgba(0,4,12,.8);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.overlay .win{max-width:440px;width:92%;text-align:center;padding:26px;animation:pop .35s ease}
.overlay .big{font-family:var(--head);font-size:46px;font-weight:700;color:#fff;text-shadow:0 0 22px var(--glow);letter-spacing:.12em}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:rgba(10,26,52,.96);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:14px;box-shadow:0 0 18px rgba(79,179,255,.3);animation:pop .25s ease}
.toast b{font-family:var(--head);letter-spacing:.15em;color:var(--glow2)}
footer{color:var(--faint);font-size:12px;text-align:center;padding:30px 0}
</style>

{
 id:"g0", name:"Awakening", sub:"Java Collections Bootcamp", rank:"E", days:[1,3], stat:"STR",
 what:"Before patterns, you need weapons. In Java, most of a DSA solution is choosing the right collection and knowing its methods without looking them up. This gate drills the collections every later gate uses.",
 signals:["You need to count things → `HashMap` or `int[26]`","You need to know if you have seen something → `HashSet`","You need the most recent unfinished item → stack (`ArrayDeque` with push/pop)","You need items in arrival order → queue (`ArrayDeque` with offer/poll)","You need the smallest or largest item again and again → `PriorityQueue`","You need the nearest key below or above x → `TreeMap` / `TreeSet`"],
 steps:["Before typing, say which collection you will use and why. If you cannot say why, you are guessing.","After Accepted, solve it again with a different structure (for example HashMap → int[26]) and compare runtime.","Type the template below from memory once a day for these 3 days. Speed with the API frees your brain for the actual problem."],
 code:String.raw`// HashMap: counting and lookups
Map<Integer, Integer> freq = new HashMap<>();
for (int x : nums) freq.merge(x, 1, Integer::sum);   // freq[x]++
int c = freq.getOrDefault(7, 0);
for (Map.Entry<Integer, Integer> e : freq.entrySet()) { int k = e.getKey(), v = e.getValue(); }

Map<String, List<String>> groups = new HashMap<>();
groups.computeIfAbsent("key", k -> new ArrayList<>()).add("word");

// HashSet: membership and dedupe
Set<Integer> seen = new HashSet<>();
if (!seen.add(x)) { /* x was already present */ }

// Stack and queue: both are ArrayDeque (never use Stack or LinkedList)
Deque<Integer> stack = new ArrayDeque<>();
stack.push(1); stack.peek(); stack.pop();
Deque<Integer> queue = new ArrayDeque<>();
queue.offer(1); queue.peek(); queue.poll();

// Heaps
PriorityQueue<Integer> minHeap = new PriorityQueue<>();
PriorityQueue<Integer> maxHeap = new PriorityQueue<>(Collections.reverseOrder());
PriorityQueue<int[]> byFirst = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));

// Sorted map: floor / ceiling in O(log n)
TreeMap<Integer, String> tm = new TreeMap<>();
Integer below = tm.floorKey(10);     // largest key <= 10, or null
Integer above = tm.ceilingKey(10);   // smallest key >= 10, or null

// Sorting with comparators
Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));   // int[][]
Integer[] boxed = {3, 1, 2};
Arrays.sort(boxed, (a, b) -> Integer.compare(b, a));             // descending needs boxed
list.sort(Comparator.comparingInt(String::length).thenComparing(Comparator.naturalOrder()));`,
 traps:["`Integer a == Integer b` compares references. It works for -128..127 and silently fails above. Use `.equals` or unbox to `int`.","`ArrayDeque` does not allow `null` elements.","For `List<Integer>`, `list.remove(3)` removes index 3. Use `list.remove(Integer.valueOf(3))` to remove the value.","Iterating a `PriorityQueue` is not sorted. Only `poll()` gives elements in order."],
 problems:[
  [1,"two-sum","Two Sum","E","For each number x you need exactly one partner: target - x. How do you check in O(1) whether you have already seen it?","Walk left to right. Before storing x, look up `target - x` in a HashMap of value → index. If found, return both indices; otherwise `put(x, i)`. Checking before inserting stops x pairing with itself.","`containsKey`, `get`, `put`"],
  [217,"contains-duplicate","Contains Duplicate","E","Which collection tells you, in one call, whether an element was already present?","`HashSet.add` returns false when the element already exists. Return true the first time it returns false.","`if (!set.add(x)) return true;`"],
  [242,"valid-anagram","Valid Anagram","E","Two strings are anagrams if every letter appears the same number of times in both.","If lengths differ, return false. Use `int[26]`: increment for s, decrement for t, then check that every entry is zero. An array beats a HashMap when the alphabet is small and fixed.","`s.charAt(i) - 'a'` as the index"],
  [349,"intersection-of-two-arrays","Intersection of Two Arrays","E","You need the unique values present in both arrays. Which collection removes duplicates for you?","Put nums1 into a HashSet. For each value of nums2, if the set contains it, add it to a result set. Convert the result set to `int[]`.","`res.stream().mapToInt(Integer::intValue).toArray()`"],
  [383,"ransom-note","Ransom Note","E","Count the letters the magazine gives you, then spend them.","Count magazine letters in `int[26]`. For each letter of the note, decrement; if a count goes below zero, return false.","`int[] cnt = new int[26];`"],
  [20,"valid-parentheses","Valid Parentheses","E","The most recent unmatched opening bracket must close first. Last in, first out.","Push opening brackets. On a closing bracket the stack must be non-empty and its top must be the matching opener; pop it. At the end the stack must be empty.","`Deque<Character> st = new ArrayDeque<>();`"],
  [933,"number-of-recent-calls","Number of Recent Calls","E","Old timestamps leave from the front, new ones join at the back.","Keep a queue. On `ping(t)`: offer t, then poll from the front while the front is less than t - 3000. Return the size.","`q.offer(t); q.peekFirst(); q.pollFirst();`"],
  [1046,"last-stone-weight","Last Stone Weight","E","You repeatedly need the two largest values. Which structure gives you the max in O(log n)?","Push all stones into a max-heap. While size > 1, poll y and x; if they differ, offer y - x. Return the last stone or 0.","`new PriorityQueue<>(Collections.reverseOrder())`"],
  [1636,"sort-array-by-increasing-frequency","Sort Array by Increasing Frequency","E","A comparator exercise: sort by frequency ascending, ties by value descending.","Count with a HashMap. Box to `Integer[]` because primitive `int[]` cannot take a comparator. Compare `Integer.compare(f.get(a), f.get(b))` first, then `Integer.compare(b, a)`. Unbox back. Do not compare two `Integer` frequencies with `==`.","`Arrays.sort(boxed, comparator)`"]
 ]
},
{
 id:"g1", name:"Arrays & Hashing", sub:"Trade memory for speed", rank:"E", days:[4,6], stat:"STR",
 what:"A HashMap or HashSet turns the inner search loop of a brute-force solution (O(n)) into a single O(1) lookup, so O(n²) becomes O(n). This is the first optimisation to try on almost any array problem.",
 signals:["The brute force has a nested loop where the inner loop searches for something","Words like count, frequency, duplicate, anagram, group, unique","Values are in the range 1..n, so the array can act as its own hash table","An O(n) solution is expected and sorting would be O(n log n)"],
 steps:["Write the O(n²) brute force as a comment first.","Ask: what is the inner loop looking for? Store exactly that in a map or set.","Decide what the key is and what the value is before you write code. Most bugs here come from a fuzzy key."],
 code:String.raw`// Pattern 1: complement lookup (Two Sum family)
Map<Integer, Integer> seen = new HashMap<>();      // value -> index
for (int i = 0; i < nums.length; i++) {

 traps:["`int[]` as a HashMap key does not work: arrays use identity hashCode. Convert to a `String` or `List<Integer>`.","HashMap iteration order is not sorted. Use TreeMap when you need order."],
 problems:[
  [49,"group-anagrams","Group Anagrams","M","Anagrams become identical once you put their letters in a canonical form. What form?","For each word, sort its characters to build a key (or build a 26-count signature string). Group with `computeIfAbsent(key, k -> new ArrayList<>()).add(word)`. Return `new ArrayList<>(map.values())`.","`Arrays.sort(char[])`, `new String(chars)`"],
  [347,"top-k-frequent-elements","Top K Frequent Elements","M","First count. Then you need the k largest counts, which does not require a full sort.","Count with a HashMap. Option A: min-heap of size k ordered by frequency; poll when the size exceeds k. Option B, O(n): bucket sort where `buckets[freq]` is a list of numbers, then walk from the highest frequency down.","`PriorityQueue` with `Integer.compare(cnt.get(a), cnt.get(b))`"],
  [238,"product-of-array-except-self","Product of Array Except Self","M","The answer at i is (product of everything left of i) × (product of everything right of i).","Pass 1, left to right: `res[i]` = product of nums[0..i-1]. Pass 2, right to left with a running `suffix`: `res[i] *= suffix; suffix *= nums[i]`. No division, O(1) extra space.","Two plain loops"],
  [128,"longest-consecutive-sequence","Longest Consecutive Sequence","M","They want O(n), so sorting is out. How can you tell that a number starts a run?","Put everything into a HashSet. x starts a run only if x - 1 is absent. From each start, count upward while x + 1 exists. Every number is visited at most twice, so the total is O(n).","`set.contains(x - 1)`"],
  [36,"valid-sudoku","Valid Sudoku","M","Each row, column and 3×3 box needs its own memory of digits seen.","Keep `boolean[9][9]` tables for rows, columns and boxes. The box index is `(r / 3) * 3 + c / 3`. A repeat in any table means invalid.","`boolean[][] row = new boolean[9][9];`"],
  [169,"majority-element","Majority Element","E","The majority appears more than n/2 times, so it survives even if every other element cancels one copy of it.","Boyer–Moore voting: keep `candidate` and `count`. When count is 0, take the current number as candidate. Add 1 if equal, subtract 1 otherwise. The final candidate is the answer.","Two ints, O(1) space"],
  [448,"find-all-numbers-disappeared-in-an-array","Find All Numbers Disappeared in an Array","E","Values are in 1..n, so every value points to an index. Use the array itself as the seen-set.","For each x, make index `abs(x) - 1` negative. Indices that stay positive give the missing numbers (index + 1).","`Math.abs(nums[i])`"],
  [380,"insert-delete-getrandom-o1","Insert Delete GetRandom O(1)","M","A HashSet gives O(1) insert and remove but no random index. An ArrayList gives a random index but slow removal. Combine them.","ArrayList of values plus a HashMap value → index. To remove, move the last element into the removed slot, update its index in the map, then remove the last position. getRandom picks a random index.","`list.set(i, last); list.remove(list.size() - 1);`"],

{
 id:"g2", name:"Two Pointers", sub:"Converging and chasing indices", rank:"E", days:[7,9], stat:"STR",
 what:"Two indices move through the data so that each move rules out options you never need to check. It works when the input is sorted (or can be sorted), or when you read and write within the same array.",
 signals:["Sorted array plus a pair or triplet with a target sum","Palindrome checks","Remove, move or deduplicate in place with O(1) extra space","Compare or merge from both ends"],
 steps:["Pick the pointer style: opposite ends (converging) or same direction (read/write, slow/fast).","Write down the rule for moving each pointer and why that move cannot skip the answer.","With duplicates, skip equal values after recording a result."],
 code:String.raw`// Opposite ends (sorted input)
int l = 0, r = nums.length - 1;
while (l < r) {
    int sum = nums[l] + nums[r];
    if (sum == target) { /* record */ l++; r--; }
    else if (sum < target) l++;     // need a bigger sum
    else r--;                       // need a smaller sum
}

// Same direction: read pointer i, write pointer w
int w = 0;
for (int i = 0; i < nums.length; i++) {
    if (keep(nums[i])) nums[w++] = nums[i];
}
// the first w elements are the result`,
 traps:["`l < r` versus `l <= r`: decide whether one element may pair with itself.","3Sum: sort first, and skip duplicates for i, l and r separately."],

  [125,"valid-palindrome","Valid Palindrome","E","Compare from both ends and skip anything that is not a letter or digit.","l = 0, r = n - 1. Move l right past non-alphanumerics, move r left the same way, compare lowercased characters, then step both inward.","`Character.isLetterOrDigit`, `Character.toLowerCase`"],
  [167,"two-sum-ii-input-array-is-sorted","Two Sum II – Input Array Is Sorted","M","The array is sorted. If the sum is too small, which pointer should move?","Sum too small → l++. Too large → r--. Equal → return 1-based indices. Sorted order guarantees you never skip the answer.","Plain int indices"],
  [283,"move-zeroes","Move Zeroes","E","One pointer reads, another marks where the next non-zero goes.","For each non-zero, swap it with index w and increment w. Zeros drift to the end.","In-place swap"],
  [26,"remove-duplicates-from-sorted-array","Remove Duplicates from Sorted Array","E","In a sorted array, a new value is one that differs from the last value you kept.","k = 1. For i from 1: if `nums[i] != nums[k - 1]`, write `nums[k++] = nums[i]`. Return k.","Read/write pointers"],
  [977,"squares-of-a-sorted-array","Squares of a Sorted Array","E","The largest square is at one of the two ends.","Pointers at both ends; fill the result from the back with the larger square and move that pointer inward.","Fill `res[pos--]`"],
  [15,"3sum","3Sum","M","Fix one number and the rest is Two Sum II on a sorted array. The hard part is skipping duplicates.","Sort. For each i (skip if `nums[i] == nums[i-1]`), run two pointers on i+1..n-1 for target -nums[i]. After recording a triplet, move l and r past equal values. Stop early when nums[i] > 0.","`Arrays.asList(a, b, c)`"],

{
 id:"g3", name:"Sliding Window", sub:"Contiguous ranges in O(n)", rank:"D", days:[10,12], stat:"STR",
 what:"A window is a contiguous range [l, r]. Extend r to include more, and move l forward to restore a rule. Each index enters and leaves the window once, so the whole scan is O(n).",
 signals:["Contiguous subarray or substring","Longest, shortest, or count of windows that satisfy a condition","Phrases like at most K, no repeats, contains all of","A fixed window size k","Not for: target sums with negative numbers (use prefix sums)"],
 steps:["State the window's rule in one sentence, for example: at most k zeros.","Decide what you track so the rule can be checked in O(1): a count array, a map, a sum.","Loop: expand r, shrink l while invalid, record the answer."],
 code:String.raw`int l = 0, best = 0;
int[] cnt = new int[128];               // state of the current window
for (int r = 0; r < s.length(); r++) {
    cnt[s.charAt(r)]++;                 // 1. expand: add s[r]
    while (windowInvalid(cnt)) {        // 2. shrink until valid again
        cnt[s.charAt(l)]--;
        l++;
    }
    best = Math.max(best, r - l + 1);   // 3. record
}
// Shortest window that satisfies X: shrink WHILE valid and record inside that loop.
// Exactly K: atMost(K) - atMost(K - 1).`,
 traps:["Shrinking with `if` instead of `while` leaves the window invalid.","When removing a key from a HashMap window, call `remove` once its count reaches 0, otherwise `size()` is wrong."],
 problems:[
  [643,"maximum-average-subarray-i","Maximum Average Subarray I","E","Fixed window of size k. When it slides one step, what changes?","Sum the first k. Then for each i ≥ k add nums[i] and subtract nums[i - k]. Track the max sum and divide by k at the end.","`double` only at the end"],
  [121,"best-time-to-buy-and-sell-stock","Best Time to Buy and Sell Stock","E","For each selling day, the best buying day is the cheapest day before it.","Track `minPrice`. For each price: profit = price - minPrice; keep the max; then update minPrice.","Single pass"],
  [3,"longest-substring-without-repeating-characters","Longest Substring Without Repeating Characters","M","Grow the window right. When a repeat enters, jump l past the previous copy.","Keep `last[c]`, the last index of each char (`int[128]` filled with -1). For each r: `l = max(l, last[c] + 1)`, set last[c] = r, track r - l + 1.","`Arrays.fill(last, -1)`"],
  [424,"longest-repeating-character-replacement","Longest Repeating Character Replacement","M","A window is valid if (length - count of its most common letter) ≤ k.","Expand r, update counts and `maxFreq`. While `len - maxFreq > k`, shrink l. You never need to lower maxFreq: a stale value only stops the window growing, it never gives a wrong bigger answer.","`int[26]`"],
  [567,"permutation-in-string","Permutation in String","M","A permutation of s1 is a window of length |s1| in s2 with the same letter counts.","Count s1. Slide a fixed window of length |s1| over s2, updating counts, and compare. For O(1) per step, keep a `matches` counter over the 26 letters.","`Arrays.equals(a, b)`"],
  [209,"minimum-size-subarray-sum","Minimum Size Subarray Sum","M","All numbers are positive, so adding elements only grows the sum. That makes shrinking safe.","Expand r adding to sum. While sum ≥ target: record r - l + 1, subtract nums[l++]. Return 0 if nothing was recorded.","`Integer.MAX_VALUE` as the start"],

  [992,"subarrays-with-k-different-integers","Subarrays with K Different Integers","H","Exactly K is awkward to count. At most K is easy. Can you subtract?","`exactly(K) = atMost(K) - atMost(K - 1)`. In atMost, after shrinking, add `r - l + 1` (all subarrays ending at r inside the window). You will reuse this trick.","Helper `atMost(nums, k)`","side"],
  [76,"minimum-window-substring","Minimum Window Substring","H","Expand until the window covers t, then shrink as far as possible while it still covers t.","need[] from t, `missing = t.length()`. Expand r: if need[c] > 0 before decrementing, missing--. While missing == 0: record, then increment need[s[l]]; if it becomes > 0, missing++; l++. Track best start and length.","`int[128] need`","boss"]

 id:"g4", name:"Prefix Sums", sub:"Range sums and difference arrays", rank:"D", days:[13,14], stat:"STR",
 what:"pre[i] is the sum of the first i elements, so any subarray sum is one subtraction. Combined with a HashMap, it counts subarrays with a property in O(n), even when numbers are negative. The reverse trick, a difference array, applies many range updates in O(1) each.",
 signals:["Many range-sum queries","Subarray sum equals k, or divisible by k","Negative numbers present, so sliding window fails","Add v to a whole range many times, then read the result"],
 steps:["Write it out: sum(i..j) = pre[j+1] - pre[i].","Rearrange: at the current j, which earlier prefix value do I need?","Store earlier prefixes in a map, seeded with the empty prefix (0 → count 1, or 0 → index -1)."],
 code:String.raw`// Count subarrays with sum == k
Map<Integer, Integer> count = new HashMap<>();
count.put(0, 1);                       // the empty prefix

  [974,"subarray-sums-divisible-by-k","Subarray Sums Divisible by K","M","Same remainder idea, but count pairs. Java `%` can be negative.","Count remainders `((sum % k) + k) % k` in an array seeded with cnt[0] = 1. For each prefix, add how many earlier prefixes share its remainder.","`int[] cnt = new int[k]`"],

{
 id:"g5", name:"Binary Search", sub:"Including binary search on the answer", rank:"D", days:[15,18], stat:"AGI",
 what:"Halve the search space every step. It works on sorted arrays, and on any yes/no question whose answers flip exactly once (false, false, true, true). The second form, binary search on the answer, solves many problems that look unrelated to searching.",
 signals:["Sorted or rotated sorted input","Find the minimum value such that something is possible (or the maximum)","The answer lives in a huge numeric range like 1..10⁹","The problem demands O(log n)"],
 steps:["Define a predicate ok(x) and convince yourself it is monotonic.","Pick lo and hi that definitely contain the answer.","Use one template and know exactly what lo means when the loop ends."],
 code:String.raw`// Smallest x in [lo, hi] with ok(x) == true
long lo = minPossible, hi = maxPossible;
while (lo < hi) {
    long mid = lo + (hi - lo) / 2;
    if (ok(mid)) hi = mid;        // mid works, maybe something smaller works too
    else lo = mid + 1;            // mid fails, the answer is to the right
}
return lo;

// Largest x with ok(x) == true (note the +1, or the loop never ends)

// Lower bound on an array: first index with a[i] >= target

  [704,"binary-search","Binary Search","E","Learn one template and use it everywhere.","lo = 0, hi = n - 1; while lo ≤ hi: mid; equal → return; smaller → lo = mid + 1; larger → hi = mid - 1. Return -1.","`lo + (hi - lo) / 2`"],
  [35,"search-insert-position","Search Insert Position","E","You want the first index whose value is ≥ target. This is called the lower bound.","Lower bound template: lo = 0, hi = n; while lo < hi: if nums[mid] < target, lo = mid + 1, else hi = mid. Return lo.","Lower bound"],

  [74,"search-a-2d-matrix","Search a 2D Matrix","M","Read row by row, the matrix is one sorted array.","Binary search 0..m·n - 1 and map an index to `matrix[mid / n][mid % n]`.","Index math"],
  [153,"find-minimum-in-rotated-sorted-array","Find Minimum in Rotated Sorted Array","M","Compare the middle with the right end. Which half contains the drop?","While lo < hi: if `nums[mid] > nums[hi]` the minimum is right of mid (lo = mid + 1), else hi = mid. Return nums[lo].","`while (lo < hi)` form"],
  [33,"search-in-rotated-sorted-array","Search in Rotated Sorted Array","M","At any mid, at least one half is sorted. Is the target inside that half?","If `nums[lo] <= nums[mid]` the left half is sorted: go left if target is in [nums[lo], nums[mid]), else go right. Otherwise the right half is sorted: go right if target is in (nums[mid], nums[hi]], else left.","Careful inclusive bounds"],
  [162,"find-peak-element","Find Peak Element","M","If you are walking uphill, a peak must exist ahead of you.","If `nums[mid] < nums[mid + 1]`, lo = mid + 1, else hi = mid. Return lo.","Binary search without sorted input"],
  [875,"koko-eating-bananas","Koko Eating Bananas","M","Do not search the array. Search the speed k. If speed k works, every faster speed works too.","Binary search k in [1, max(piles)]. ok(k) sums `(p + k - 1) / k` hours as a long. Find the smallest k with hours ≤ h.","`long hours`"],
  [1011,"capacity-to-ship-packages-within-d-days","Capacity To Ship Packages Within D Days","M","Same shape as Koko: a monotonic yes/no question over the capacity.","lo = heaviest package, hi = total weight. ok(cap) greedily fills days and counts them. Smallest cap with days ≤ D.","Greedy check + binary search"],
  [981,"time-based-key-value-store","Time Based Key-Value Store","M","For each key you want the latest value with timestamp ≤ t. A sorted map answers that in one call.","`Map<String, TreeMap<Integer, String>>`. set → put. get → `floorEntry(t)`; return its value, or an empty string if it is null. (Timestamps arrive increasing, so binary search on a list also works.)","`TreeMap.floorEntry`"],
  [4,"median-of-two-sorted-arrays","Median of Two Sorted Arrays","H","Binary search a cut in the smaller array so everything left of both cuts is ≤ everything right of them.","A is the smaller array. Cut i in A, j = (m + n + 1) / 2 - i in B. Valid when `A[i-1] <= B[j]` and `B[j-1] <= A[i]`, using ±infinity past the edges. Move i by binary search. Median from max(left side) and min(right side).","`Integer.MIN_VALUE` / `MAX_VALUE` sentinels","side"],

{
 id:"g6", name:"Stack & Monotonic Stack", sub:"Unfinished work and next-greater", rank:"C", days:[19,21], stat:"AGI",
 what:"A stack holds unfinished work, most recent on top. A monotonic stack keeps its elements in increasing or decreasing order; an element is popped exactly when the current element answers its question (next greater, next smaller). A monotonic deque does the same for sliding windows.",
 signals:["Matching brackets or nested structure","Next greater / next smaller / previous smaller element","How far can this bar extend left or right","Maximum of every window of size k (monotonic deque)","Expressions and parsing"],
 steps:["Ask: what is each element waiting for?","Elements still waiting stay on the stack. Store indices, not values, so you can compute distances.","When the current element answers the top, pop and record. Then push the current element."],
 code:String.raw`// Next greater element to the right for every index
int[] ans = new int[n];
Arrays.fill(ans, -1);
Deque<Integer> st = new ArrayDeque<>();      // indices, values decreasing from bottom to top
for (int i = 0; i < n; i++) {
    while (!st.isEmpty() && nums[st.peek()] < nums[i]) {
        ans[st.pop()] = nums[i];             // i answers the waiting index
    }
    st.push(i);
}

// Monotonic deque: max of each window of size k
Deque<Integer> dq = new ArrayDeque<>();
for (int i = 0; i < n; i++) {
    while (!dq.isEmpty() && nums[dq.peekLast()] <= nums[i]) dq.pollLast();
    dq.offerLast(i);
    if (dq.peekFirst() <= i - k) dq.pollFirst();
    if (i >= k - 1) res[i - k + 1] = nums[dq.peekFirst()];
}`,
 traps:["Calling `peek()` on an empty ArrayDeque returns null, which then throws on unboxing. Check `isEmpty()` first.","For counting problems with equal values, use strict on one side and non-strict on the other to avoid double counting."],
 problems:[
  [155,"min-stack","Min Stack","M","Each element can remember the minimum at the moment it was pushed.","Push pairs `[val, minSoFar]` onto one stack, or keep a second stack of minimums. getMin reads the top.","`Deque<int[]>`"],
  [150,"evaluate-reverse-polish-notation","Evaluate Reverse Polish Notation","M","Numbers wait on a stack until an operator consumes the top two.","For an operator: pop b, then pop a, push `a op b` (order matters for - and /). Otherwise push `Integer.parseInt(token)`.","`switch` on strings"],
  [496,"next-greater-element-i","Next Greater Element I","E","Your first monotonic stack. Keep numbers that are still waiting for something bigger.","Walk nums2. While the top is smaller than x, pop it and record `next.put(top, x)`. Push x. Answer nums1 from the map (default -1).","`getOrDefault(x, -1)`"],
  [739,"daily-temperatures","Daily Temperatures","M","For each day you want the next warmer day. Days without an answer yet wait on a stack.","Stack of indices with decreasing temperatures. For each i, while `t[i] > t[peek]`, pop j and set `ans[j] = i - j`. Push i.","Store indices"],
  [503,"next-greater-element-ii","Next Greater Element II","M","Circular array: pretend you walk it twice.","Loop i over 0..2n-1 using `nums[i % n]`. Same monotonic stack of indices; push only during the first pass.","`i % n`"],
  [853,"car-fleet","Car Fleet","M","Process cars from closest to the target. A car behind that would arrive sooner gets blocked and joins the fleet ahead.","Sort by position descending. time = (target - pos) / (double) speed. If time > current fleet time, it is a new fleet: update and count.","`Arrays.sort(cars, (a, b) -> Integer.compare(b[0], a[0]))`"],
  [394,"decode-string","Decode String","M","Nested brackets: save your progress when you enter a bracket and restore it when you leave.","Two stacks: counts and StringBuilders. Digit → build k. '[' → push k and the current builder, start a new one. ']' → pop k and the previous builder; append current k times to it. Letter → append.","`Deque<StringBuilder>`"],
  [907,"sum-of-subarray-minimums","Sum of Subarray Minimums","M","Flip the question: in how many subarrays is arr[i] the minimum?","Monotonic stacks give `left[i]` (distance to previous smaller) and `right[i]` (distance to next smaller-or-equal). Contribution = arr[i] × left × right. Sum mod 1e9+7 with long.","`long`, `MOD = 1_000_000_007`"],
  [239,"sliding-window-maximum","Sliding Window Maximum","H","Keep a deque of indices whose values decrease. The front is always the window max.","For each i: pop the back while its value ≤ nums[i]; add i; pop the front if it left the window (≤ i - k); once i ≥ k - 1, record the front value.","`peekFirst`, `pollLast`","side"],
  [84,"largest-rectangle-in-histogram","Largest Rectangle in Histogram","H","For each bar as the shortest bar, how far can the rectangle stretch?","Stack of indices with increasing heights. When the current height is lower than the top, pop it as height h; width = i - newTop - 1 (or i if the stack is empty). Run i to n with height 0 at i = n to flush the stack.","`int h = (i == n) ? 0 : heights[i]`","boss"]
 ]

{
 id:"g7", name:"Linked Lists", sub:"Pointer rewiring", rank:"C", days:[22,23], stat:"AGI",
 what:"Linked list problems are about rewiring next pointers without losing nodes. Three tools cover most of them: a dummy head, fast/slow pointers, and in-place reversal.",
 signals:["The input is a ListNode","Find the middle, detect a cycle, or find the kth from the end","Reverse all or part of the list","Merge sorted lists"],
 steps:["Draw 3–4 nodes on paper with arrows, before and after.","Save `next` before you overwrite `cur.next`.","Use a dummy node whenever the head might change."],
 code:String.raw`// Reverse
ListNode prev = null, cur = head;
while (cur != null) {
    ListNode next = cur.next;
    cur.next = prev;
    prev = cur;
    cur = next;
}
// prev is the new head

// Fast / slow
ListNode slow = head, fast = head;
while (fast != null && fast.next != null) {
    slow = slow.next;
    fast = fast.next.next;
    // if (slow == fast) there is a cycle
}
// slow is now the middle

// Dummy head
ListNode dummy = new ListNode(0, head), tail = dummy;
// ... build after tail ...
return dummy.next;`,
 traps:["NullPointerException from `fast.next.next`: check both `fast` and `fast.next`.","Compare nodes with `==` (identity), values with `.val`."],
 problems:[
  [206,"reverse-linked-list","Reverse Linked List","E","You need three references: previous, current, next.","While cur != null: save next, point cur.next at prev, prev = cur, cur = next. Return prev. Then write the recursive version.","`ListNode prev = null`"],
  [21,"merge-two-sorted-lists","Merge Two Sorted Lists","E","A dummy head removes the special case for the first node.","Attach the smaller head to tail each step and advance it. Attach the remainder at the end. Return dummy.next.","Dummy node"],
  [141,"linked-list-cycle","Linked List Cycle","E","A fast runner on a circular track eventually laps a slow one.","slow moves 1, fast moves 2. If they meet, there is a cycle; if fast reaches null, there is none.","`while (fast != null && fast.next != null)`"],

 code:String.raw`// DFS that returns info upward and records a global answer
int best = 0;
int height(TreeNode node) {
    if (node == null) return 0;
    int l = height(node.left);
    int r = height(node.right);
    best = Math.max(best, l + r);      // answer may use both sides
    return 1 + Math.max(l, r);         // parent can only use one side
}

// BFS by levels
List<List<Integer>> levels = new ArrayList<>();
Queue<TreeNode> q = new ArrayDeque<>();
if (root != null) q.offer(root);
while (!q.isEmpty()) {
    int size = q.size();               // nodes in this level
    List<Integer> level = new ArrayList<>();
    for (int i = 0; i < size; i++) {
        TreeNode cur = q.poll();
        level.add(cur.val);
        if (cur.left != null) q.offer(cur.left);
        if (cur.right != null) q.offer(cur.right);
    }
    levels.add(level);
}`,

 code:String.raw`List<List<Integer>> res = new ArrayList<>();

void backtrack(int[] nums, int start, List<Integer> path) {
    res.add(new ArrayList<>(path));            // record a COPY (subsets record every node)
    for (int i = start; i < nums.length; i++) {
        if (i > start && nums[i] == nums[i - 1]) continue;   // dedupe (input sorted)
        path.add(nums[i]);                     // choose
        backtrack(nums, i + 1, path);          // explore  (use i instead of i + 1 to allow reuse)
        path.remove(path.size() - 1);          // un-choose
    }
}`,

 code:String.raw`// Adjacency list (undirected). For directed graphs add only adj.get(e[0]).add(e[1]).
List<List<Integer>> adj = new ArrayList<>();
for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
for (int[] e : edges) { adj.get(e[0]).add(e[1]); adj.get(e[1]).add(e[0]); }

// BFS on a grid: fewest steps from (sr, sc) to (tr, tc)
int[][] DIRS = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};
Deque<int[]> q = new ArrayDeque<>();
boolean[][] seen = new boolean[m][n];
q.offer(new int[]{sr, sc});
seen[sr][sc] = true;
for (int steps = 0; !q.isEmpty(); steps++) {
    for (int size = q.size(); size > 0; size--) {
        int[] cur = q.poll();
        if (cur[0] == tr && cur[1] == tc) return steps;
        for (int[] d : DIRS) {
            int nr = cur[0] + d[0], nc = cur[1] + d[1];
            if (nr < 0 || nc < 0 || nr >= m || nc >= n || seen[nr][nc] || grid[nr][nc] == 1) continue;
            seen[nr][nc] = true;               // mark on enqueue
            q.offer(new int[]{nr, nc});
        }
    }
}

// Kahn's topological sort (directed adj)
int[] indeg = new int[n];
for (int u = 0; u < n; u++) for (int v : adj.get(u)) indeg[v]++;
Deque<Integer> ready = new ArrayDeque<>();
for (int i = 0; i < n; i++) if (indeg[i] == 0) ready.offer(i);
List<Integer> order = new ArrayList<>();
while (!ready.isEmpty()) {
    int u = ready.poll();
    order.add(u);
    for (int v : adj.get(u)) if (--indeg[v] == 0) ready.offer(v);
}

 steps:["Check edge weights: all equal → BFS; non-negative → Dijkstra; edge-count limit → Bellman-Ford.","In Dijkstra, skip stale heap entries (`d > dist[u]`).","For DSU, always use path compression; add union by size for safety."],
 code:String.raw`// Dijkstra (non-negative weights). adj.get(u) holds int[]{v, w}
int[] dist = new int[n];
Arrays.fill(dist, Integer.MAX_VALUE);
dist[src] = 0;
PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));
pq.offer(new int[]{0, src});
while (!pq.isEmpty()) {
    int[] top = pq.poll();
    int d = top[0], u = top[1];
    if (d > dist[u]) continue;                 // stale entry
    for (int[] e : adj.get(u)) {
        int v = e[0], nd = d + e[1];
        if (nd < dist[v]) { dist[v] = nd; pq.offer(new int[]{nd, v}); }
    }
}

// Union-Find with path compression and union by size
int[] parent, size;
void init(int n) {
    parent = new int[n]; size = new int[n];
    for (int i = 0; i < n; i++) { parent[i] = i; size[i] = 1; }
}
int find(int x) {
    while (parent[x] != x) { parent[x] = parent[parent[x]]; x = parent[x]; }
    return x;
}
boolean union(int a, int b) {
    int ra = find(a), rb = find(b);
    if (ra == rb) return false;                // already connected
    if (size[ra] < size[rb]) { int t = ra; ra = rb; rb = t; }
    parent[rb] = ra;
    size[ra] += size[rb];
    return true;
}`,

 id:"g13", name:"Greedy & Intervals", sub:"Best local choice, sort first", rank:"A", days:[41,43], stat:"SEN",
 what:"Make the locally best choice and never undo it. Greedy is correct only when you can argue the greedy choice is never worse than any alternative (an exchange argument). Interval problems almost always start with a sort.",
 signals:["Intervals, meetings, schedules, balloons","Minimum number of removals, arrows, rooms, groups","How far can you reach / jump","Assign or pair items to minimise or maximise something"],
 steps:["Try the greedy idea on 3 small examples and actively try to break it.","Sort by start to merge; sort by end to keep the maximum number of non-overlapping intervals.","If you can break the greedy, the problem is probably DP."],
 code:String.raw`// Merge intervals
Arrays.sort(iv, (a, b) -> Integer.compare(a[0], b[0]));
List<int[]> res = new ArrayList<>();
for (int[] cur : iv) {
    if (res.isEmpty() || res.get(res.size() - 1)[1] < cur[0]) res.add(cur);
    else res.get(res.size() - 1)[1] = Math.max(res.get(res.size() - 1)[1], cur[1]);
}
int[][] merged = res.toArray(new int[0][]);

// Maximum non-overlapping: sort by END and keep greedily
Arrays.sort(iv, (a, b) -> Integer.compare(a[1], b[1]));
int kept = 0;
long lastEnd = Long.MIN_VALUE;
for (int[] cur : iv) {
    if (cur[0] >= lastEnd) { kept++; lastEnd = cur[1]; }
}`,

{
 id:"g14", name:"Dynamic Programming I", sub:"1D states and knapsack", rank:"A", days:[44,47], stat:"INT",
 what:"DP is recursion plus memory. If the brute-force recursion solves the same subproblem many times, cache it. Then, optionally, turn it into a loop. Most interview DP problems are 1D: one index of state.",
 signals:["Number of ways","Minimum or maximum cost / profit","Can you reach / can you build","Each choice affects future options, and greedy fails on some example"],
 steps:["State: write `dp[i] = ...` as one full sentence.","Transition: how does dp[i] come from smaller states?","Base cases.","Order: memoized recursion, or loops that fill smaller states first.","Answer location, then compress space if the transition only looks back a few steps."],
 code:String.raw`// Top-down: start here. Recursion + memo (House Robber)
int[] memo;
int solve(int[] nums, int i) {
    if (i >= nums.length) return 0;                 // base case
    if (memo[i] != -1) return memo[i];
    int take = nums[i] + solve(nums, i + 2);        // choice 1
    int skip = solve(nums, i + 1);                  // choice 2
    return memo[i] = Math.max(take, skip);
}
// memo = new int[n]; Arrays.fill(memo, -1); solve(nums, 0);

// Bottom-up: same recurrence, filled in order
int[] dp = new int[n + 2];
for (int i = n - 1; i >= 0; i--) dp[i] = Math.max(nums[i] + dp[i + 2], dp[i + 1]);

// Knapsack loop directions
// 0/1 (each item once):  for (int s = target; s >= w; s--) dp[s] |= dp[s - w];
// unbounded (reuse):     for (int s = w; s <= target; s++) dp[s] += dp[s - w];`,
 traps:["Memo arrays filled with 0 confuse a real answer of 0 with not computed. Fill with -1.","Coin Change II: loop order (coins outer vs amount outer) changes combinations into permutations."],

  [70,"climbing-stairs","Climbing Stairs","E","To stand on step n, your last move came from n - 1 or n - 2.","dp[n] = dp[n-1] + dp[n-2], dp[0] = dp[1] = 1. Keep two variables.","Recursion → memo → loop"],
  [746,"min-cost-climbing-stairs","Min Cost Climbing Stairs","E","The cost to reach i is the cheaper of reaching i - 1 or i - 2, plus what you pay at i.","dp[i] = cost[i] + min(dp[i-1], dp[i-2]). Answer = min(dp[n-1], dp[n-2]).","Two rolling variables"],

  [91,"decode-ways","Decode Ways","M","The last step uses one digit (1–9) or two digits (10–26).","dp[i] = ways to decode the first i chars. Add dp[i-1] if s[i-1] != '0'. Add dp[i-2] if the two-digit value is 10..26.","Char math"],
  [322,"coin-change","Coin Change","M","The best way to make amount a ends with some coin c, so look at a - c.","dp[0] = 0, others amount + 1 (infinity). For a in 1..amount, for each coin ≤ a: dp[a] = min(dp[a], dp[a - c] + 1). Still infinity → -1.","Unbounded knapsack"],
  [518,"coin-change-ii","Coin Change II","M","Count combinations, not orderings. The loop order decides which one you count.","dp[0] = 1. Coins in the outer loop, amounts ascending inside: dp[a] += dp[a - c]. Swapping the loops counts permutations, which is wrong here.","Loop order is the lesson"],
  [300,"longest-increasing-subsequence","Longest Increasing Subsequence","M","dp[i] = length of the longest increasing subsequence ending at i. Then learn the O(n log n) version.","O(n²): dp[i] = 1 + max dp[j] for j < i with nums[j] < nums[i]. O(n log n): keep `tails`; for each x, replace the first tail ≥ x (lower bound) or append. tails length = answer.","Binary search on `tails`"],
  [139,"word-break","Word Break","M","dp[i] = can the first i characters be split into dictionary words?","dp[0] = true. For each i and each j < i: if dp[j] and s[j..i) is in the set, dp[i] = true.","`new HashSet<>(wordDict)`"],
  [152,"maximum-product-subarray","Maximum Product Subarray","M","A negative number turns the smallest product into the largest. Track both.","Keep curMax and curMin. For each x, candidates are x, x·curMax, x·curMin; compute the new max and min from the old values, update the answer.","Use temp variables"],

 id:"g15", name:"Dynamic Programming II", sub:"Grids, two strings, palindromes", rank:"A", days:[48,51], stat:"INT",
 what:"Two indices of state: a grid cell (r, c), a pair of string prefixes (i, j), or an interval [i, j] of one string. The recipe is the same as 1D; only the table grows.",
 signals:["Compare or transform two strings (LCS, edit distance)","Count or optimise paths in a grid","Palindromic substrings or subsequences","Subsequence matching"],
 steps:["For two strings, dp[i][j] covers prefixes of length i and j. Look at their last characters.","Size the table (m + 1) × (n + 1) so row 0 and column 0 mean the empty prefix.","For interval DP on one string, fill by increasing length or with i descending."],
 code:String.raw`// Two-string DP skeleton: Longest Common Subsequence
int m = a.length(), n = b.length();
int[][] dp = new int[m + 1][n + 1];            // row 0 / col 0 = empty prefix
for (int i = 1; i <= m; i++) {
    for (int j = 1; j <= n; j++) {
        if (a.charAt(i - 1) == b.charAt(j - 1)) dp[i][j] = dp[i - 1][j - 1] + 1;
        else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
}
return dp[m][n];

// Palindrome centre expansion
int expand(String s, int l, int r) {
    while (l >= 0 && r < s.length() && s.charAt(l) == s.charAt(r)) { l--; r++; }
    return r - l - 1;                          // length of the palindrome
}`,

  [72,"edit-distance","Edit Distance","M","The three operations map to three neighbouring cells.","Equal chars → dp[i-1][j-1]. Else 1 + min(delete dp[i-1][j], insert dp[i][j-1], replace dp[i-1][j-1]). Base: dp[i][0] = i, dp[0][j] = j.","Classic 2D string DP"],
  [5,"longest-palindromic-substring","Longest Palindromic Substring","M","Every palindrome has a centre: a character or a gap between two.","Expand around each centre for odd (i, i) and even (i, i + 1) lengths; track the longest. O(n²) time, O(1) space.","`expand` helper"],

  [97,"interleaving-string","Interleaving String","M","dp[i][j]: can the first i chars of s1 and first j of s2 form the first i + j of s3?","dp[i][j] = (dp[i-1][j] && s1[i-1] == s3[i+j-1]) || (dp[i][j-1] && s2[j-1] == s3[i+j-1]). Check lengths first.","`boolean[m + 1][n + 1]`"],
  [494,"target-sum","Target Sum","M","Signs split the numbers into P and N with P - N = target and P + N = sum.","So P = (sum + target) / 2. Count subsets with that sum (0/1 knapsack counting, backward loop, dp[0] = 1). Odd or negative (sum + target) → 0.","Reduce to a known DP"],

  [10,"regular-expression-matching","Regular Expression Matching","H","'*' means zero or more of the previous char: use it zero times, or consume one more char.","dp[i][j]: does s[0..i) match p[0..j)? If p[j-1] == '*': dp[i][j-2] (zero uses) or (prev char matches s[i-1] and dp[i-1][j]). Else the chars match (or '.') and dp[i-1][j-1]. Initialise dp[0][j] for patterns like a*b*.","Draw the table first","boss"]

{
 id:"g16", name:"Dynamic Programming III", sub:"Interval, tree, bitmask, digit DP", rank:"S", days:[52,54], stat:"INT",
 what:"Advanced state design. Interval DP picks the last action inside a range. Tree DP returns several values per node. Bitmask DP stores a set of used items in an int when n ≤ 20. Digit DP counts numbers up to N with a digit property.",
 signals:["n ≤ 16–20 and you choose or order items → bitmask","Burst, cut, merge inside a range → interval DP","Choose nodes in a tree with neighbour rules → tree DP","Count integers in [1, N] with a digit rule → digit DP"],
 steps:["Ask: what is the smallest information that describes the remaining problem? That is your state.","For interval DP, think about which action happens last in [i, j].","Estimate states × transitions before coding to make sure it fits."],
 code:String.raw`// Interval DP: dp[i][j] over a range, filled by length
for (int len = 2; len < m; len++) {
    for (int i = 0; i + len < m; i++) {
        int j = i + len;
        dp[i][j] = Integer.MAX_VALUE;
        for (int k = i + 1; k < j; k++) {
            dp[i][j] = Math.min(dp[i][j], dp[i][k] + dp[k][j] + cost(i, j));
        }
    }
}

// Bitmask basics
boolean has = ((mask >> i) & 1) == 1;
int with = mask | (1 << i);
int without = mask & ~(1 << i);
int full = (1 << n) - 1;
for (int sub = mask; sub > 0; sub = (sub - 1) & mask) { /* every non-empty submask */ }

// Tree DP: return several answers per node
int[] dfs(TreeNode node) {                     // {bestIfTaken, bestIfSkipped}
    if (node == null) return new int[]{0, 0};
    int[] L = dfs(node.left), R = dfs(node.right);
    int take = node.val + L[1] + R[1];
    int skip = Math.max(L[0], L[1]) + Math.max(R[0], R[1]);
    return new int[]{take, skip};
}`,

  [698,"partition-to-k-equal-sum-subsets","Partition to K Equal Sum Subsets","M","n ≤ 16 is the hint: 2¹⁶ subsets fit in memory. Use a bitmask of used numbers.","dp[mask] = fill of the current bucket, or -1 if unreachable. For each reachable mask and unused i with dp[mask] + nums[i] ≤ target: dp[mask | 1<<i] = (dp[mask] + nums[i]) % target. Answer dp[full] == 0.","`1 << i`"],

  [1547,"minimum-cost-to-cut-a-stick","Minimum Cost to Cut a Stick","H","Interval DP. Instead of the first cut, choose which cut in a segment happens first and split there.","Add 0 and n to the cuts, sort. dp[i][j] = min over k in (i, j) of dp[i][k] + dp[k][j] + (cuts[j] - cuts[i]). Fill by increasing length.","Template above"],

  [188,"best-time-to-buy-and-sell-stock-iv","Best Time to Buy and Sell Stock IV","H","The stock state machine again, with a transaction counter.","For t in 1..k: buy[t] = max(buy[t], sell[t-1] - p); sell[t] = max(sell[t], buy[t] + p). buy starts at -infinity. Answer sell[k].","Arrays of size k + 1"],
  [968,"binary-tree-cameras","Binary Tree Cameras","H","Greedy from the leaves up: a leaf's parent should hold the camera.","dfs returns 0 = not covered, 1 = has camera, 2 = covered. Any child 0 → place a camera, count++, return 1. Any child 1 → return 2. Else return 0. Null → 2. If the root returns 0, add one.","State-returning DFS"],

  [233,"number-of-digit-one","Number of Digit One","H","Count position by position: how often is the digit at place p a 1?","For p = 1, 10, 100...: high = n / (p·10), cur = (n / p) % 10, low = n % p. Ones = high·p + (cur > 1 ? p : cur == 1 ? low + 1 : 0). Your entry point to digit DP.","`long p`","side"],

{
 id:"g17", name:"Tries, Bits & Math", sub:"Prefix trees and number tricks", rank:"S", days:[55,56], stat:"INT",
 what:"A trie stores strings character by character, so prefix questions cost O(length). Bit manipulation and a little number theory (sieve, fast power, modular arithmetic) appear in contests constantly.",
 signals:["Many words, prefix search, wildcard match → trie","Maximum XOR → binary trie","Single / missing number with O(1) space → XOR","Answer modulo 1e9+7 with huge exponents → fast power","Primes up to n → sieve"],
 steps:["For tries, write the Node class first and keep it tiny.","For bits, test each trick on paper with 4-bit numbers.","For modular arithmetic, reduce after every multiply and use long."],
 code:String.raw`class Trie {
    Trie[] next = new Trie[26];
    boolean end;

    void insert(String w) {
        Trie node = this;
        for (char c : w.toCharArray()) {
            if (node.next[c - 'a'] == null) node.next[c - 'a'] = new Trie();
            node = node.next[c - 'a'];
        }
        node.end = true;
    }
}

// Bit tricks (expression  ->  meaning)
// x & 1          odd?
// x & (x - 1)    drop the lowest set bit
// x & -x         lowest set bit alone
// Integer.bitCount(x), Integer.numberOfTrailingZeros(x), Integer.highestOneBit(x)

// Fast modular power
long modPow(long b, long e, long mod) {
    long r = 1;
    b %= mod;
    while (e > 0) {
        if ((e & 1) == 1) r = r * b % mod;
        b = b * b % mod;
        e >>= 1;
    }
    return r;
}`,
 traps:["`>>` keeps the sign, `>>>` shifts in zeros.","`-Integer.MIN_VALUE` is still negative; convert to long before negating."],

  [211,"design-add-and-search-words-data-structure","Design Add and Search Words Data Structure","M","A trie, where '.' means try every child.","Recursive search(word, i, node): on '.', try each non-null child; otherwise follow the single child.","DFS in a trie"],

 code:String.raw`// Fenwick tree (Binary Indexed Tree), 1-indexed
class BIT {
    int[] t;
    BIT(int n) { t = new int[n + 1]; }
    void add(int i, int delta) { for (; i < t.length; i += i & -i) t[i] += delta; }
    int sum(int i) { int s = 0; for (; i > 0; i -= i & -i) s += t[i]; return s; }   // sum of [1..i]
    int range(int l, int r) { return sum(r) - sum(l - 1); }
}

// Coordinate compression: values -> ranks 1..m
int[] sorted = Arrays.stream(nums).distinct().sorted().toArray();
int rank = Arrays.binarySearch(sorted, x) + 1;

// Iterative segment tree, range max with point updates
int size = 1;
while (size < n) size <<= 1;
int[] seg = new int[2 * size];
void update(int i, int v) {
    i += size; seg[i] = v;
    for (i >>= 1; i > 0; i >>= 1) seg[i] = Math.max(seg[2 * i], seg[2 * i + 1]);
}
int query(int l, int r) {                      // inclusive [l, r]
    int res = 0;
    for (l += size, r += size + 1; l < r; l >>= 1, r >>= 1) {
        if ((l & 1) == 1) res = Math.max(res, seg[l++]);
        if ((r & 1) == 1) res = Math.max(res, seg[--r]);
    }
    return res;
}`,
