function fromDnum(n){ const d = new Date(n * 864e5); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
function addDays(s, k){ return fromDnum(dnum(s) + k); }

const KW = new Set("abstract boolean break byte case catch char class continue default do double else enum extends final finally float for if implements import int interface long new null package private protected public return short static super switch this throw throws true false try void while var".split(" "));
function hl(code){
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b([A-Za-z_]\w*)\b|\b(\d[\d_]*[lLfFdD]?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="c">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="s">' + esc(m[2]) + "</span>";
    else if (m[3]) out += KW.has(m[3]) ? '<span class="k">' + m[3] + "</span>" : /^[A-Z]/.test(m[3]) ? '<span class="t">' + m[3] + "</span>" : m[3];
    else out += '<span class="n">' + m[4] + "</span>";
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
let CODE_BLOCKS = [];
function codeBlock(src){
  CODE_BLOCKS.push(src);
  return '<div class="codewrap"><button class="btn" data-act="copy" data-i="' + (CODE_BLOCKS.length - 1) + '">Copy</button><pre class="code">' + hl(src) + "</pre></div>";
}

/* ---------- state ---------- */
function freshState(){ return {name:"Hunter", start:todayStr(), solved:{}, ap:{}, notes:{}, quiz:{}, bonus:{}, contests:[], lv:1}; }
let S;
try { S = Object.assign(freshState(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) { S = freshState(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- derived values ---------- */
function computeXP(){
  let xp = 0;
  for (const id in S.solved) {
    const p = PMAP[id], s = S.solved[id];
    if (!p) continue;
    xp += Math.round(XPV[p.diff] * (s.a ? 0.6 : 1)) + (s.r ? s.r.length : 0) * 5;
  }
  xp += Object.keys(S.quiz).length * 3;
  xp += Object.keys(S.bonus).length * 30;
  for (const c of S.contests) xp += 20 + 20 * c.n;
  return xp;
}
const levelOf = xp => Math.floor(Math.sqrt(xp / 3)) + 1;
const xpForLevel = L => 3 * (L - 1) * (L - 1);
function rankOf(L){ let r = "E"; for (const [k, min] of RANKS) if (L >= min) r = k; return r; }
function dayNo(){ return dnum(todayStr()) - dnum(S.start) + 1; }
function currentGate(){
  const d = Math.max(1, Math.min(dayNo(), PLAN_DAYS));
  return GATES.find(g => d >= g.days[0] && d <= g.days[1]) || GATES[GATES.length - 1];
}
const isSolved = n => !!S.solved[n];
const core = g => g.problems.filter(p => p.flag !== "side");
const gateCleared = g => core(g).every(p => isSolved(p.num));
function nextDue(s){
  const st = s.r ? s.r.length : 0;
  if (st >= REVIEW_GAPS.length) return null;
  return addDays(st === 0 ? s.d : s.r[st - 1], REVIEW_GAPS[st]);
}
function dueList(){
  const t = todayStr();
  return Object.keys(S.solved).filter(id => PMAP[id]).map(id => ({p:PMAP[id], due:nextDue(S.solved[id])}))
    .filter(x => x.due && x.due <= t).sort((a, b) => a.due < b.due ? -1 : 1);
}
function activeDates(){
  const set = new Set();
  for (const id in S.solved) { const s = S.solved[id]; set.add(s.d); (s.r || []).forEach(d => set.add(d)); }
  S.contests.forEach(c => set.add(c.d));
  return set;
}
function streak(){
  const set = activeDates();
  let d = todayStr();
  if (!set.has(d)) d = addDays(d, -1);
  let n = 0;
  while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function penaltyActive(){
  const y = addDays(todayStr(), -1);
  return dnum(S.start) <= dnum(y) - 1 && !activeDates().has(y);
}
function todayCounts(){
  const t = todayStr();
  let clears = 0, reviews = 0;
  for (const id in S.solved) { const s = S.solved[id]; if (s.d === t) clears++; (s.r || []).forEach(d => { if (d === t) reviews++; }); }
  const note = Object.values(S.notes).some(n => n.d === t && n.t.trim());
  return {clears, reviews, note};
}
function statValues(){
  const out = {};
  STATS.forEach(([k]) => out[k] = {done:0, total:0});
  ALL.forEach(p => { const o = out[p.gate.stat]; o.total++; if (isSolved(p.num)) o.done++; });
  return out;
}

/* ---------- toasts and overlays ---------- */
function toast(html){
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = html;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function overlay(html){
  const el = document.createElement("div");
  el.className = "overlay";
  el.innerHTML = '<div class="win">' + html + '<div style="margin-top:18px"><button class="btn big" data-act="close-ov">Continue</button></div></div>';
  document.body.appendChild(el);
}
function commit(){
  const L = levelOf(computeXP());
  if (L > S.lv) {
    const oldR = rankOf(S.lv), newR = rankOf(L);
    overlay('<div class="tag" style="font-family:var(--head);letter-spacing:.3em;color:var(--glow2)">[ SYSTEM ]</div><div class="big">LEVEL UP</div><p style="font-size:18px">Level ' + S.lv + " → <b>" + L + "</b></p>" +
      (oldR !== newR ? '<p style="margin-top:10px">Rank re-evaluation complete. You are now <span class="rank" style="color:var(--' + newR + ')">' + newR + "</span> rank.</p>" : ""));
  }
  S.lv = L;
  save();
  render();
}

/* =====================================================================
   RENDERING
   ===================================================================== */
function renderStatus(){
  const xp = computeXP(), L = levelOf(xp), R = rankOf(L);
  const lo = xpForLevel(L), hi = xpForLevel(L + 1);
  const pct = Math.min(100, Math.round((xp - lo) / (hi - lo) * 100));
  const solved = Object.keys(S.solved).filter(id => PMAP[id]).length;
  const day = dayNo();
  const sv = statValues();
  const bossTotal = ALL.filter(p => p.flag === "boss").length;
  const bossDone = ALL.filter(p => p.flag === "boss" && isSolved(p.num)).length;
  const title = bossDone === bossTotal ? "Shadow Monarch" : TITLES[R];
  $("#status").innerHTML =
    '<div class="win-title">Status Window</div><div class="win-body status">' +
    '<div><div class="lvl"><div><div class="lvl-num">' + L + '</div><div class="lvl-lab">LEVEL</div></div>' +
    '<div style="flex:1"><input class="name-in" id="hname" value="' + esc(S.name) + '" aria-label="Hunter name">' +
    '<div class="muted small" style="margin:4px 0">Title: <b style="color:#fff">' + title + "</b> · Job: Java Hunter</div>" +
    '<div>Rank <span class="rank" style="color:var(--' + R + ')">' + R + "</span></div></div></div>" +
    '<div style="margin-top:12px" class="small muted">XP ' + xp + " / " + hi + ' (next level)</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
    "<div>" +
    '<div class="kv"><span>Day</span><b>' + (day > PLAN_DAYS ? PLAN_DAYS + "+ (" + day + ")" : day) + " / " + PLAN_DAYS + "</b></div>" +
    '<div class="kv"><span>Current gate</span><b>' + esc(currentGate().name) + "</b></div>" +
    '<div class="kv"><span>Problems cleared</span><b>' + solved + " / " + ALL.length + "</b></div>" +
    '<div class="kv"><span>Bosses defeated</span><b>' + bossDone + " / " + bossTotal + "</b></div>" +
    '<div class="kv"><span>Streak</span><b>' + streak() + " day" + (streak() === 1 ? "" : "s") + "</b></div>" +
    '<div class="kv"><span>Reviews due</span><b>' + dueList().length + "</b></div></div>" +
    "<div>" + STATS.map(([k, name, desc]) => {
      const v = sv[k], p = v.total ? Math.round(v.done / v.total * 100) : 0;
      return '<div class="stat" title="' + name + ": " + desc + '"><span>' + k + '</span><div class="bar"><i style="width:' + p + '%"></i></div><span class="small muted">' + v.done + "/" + v.total + "</span></div>";
    }).join("") + '<div class="small muted" style="margin-top:6px">Stats grow as you clear problems in each family. Hover a stat for details.</div></div></div>';
}

function problemRow(p, opts = {}){
  const s = S.solved[p.num];
  const base = XPV[p.diff];
  const xpNow = Math.round(base * (S.ap[p.num] && !s ? 0.6 : 1));
  const tags = (p.flag === "boss" ? '<span class="pill boss">BOSS</span>' : p.flag === "side" ? '<span class="pill side">SIDE QUEST</span>' : "") +
    (opts.showGate ? ' <a class="pill" style="color:var(--dim);text-decoration:none" href="#gate-' + p.gate.id + '">Gate ' + p.gate.idx + "</a>" : "") +
    (opts.extra || "");
  const note = (S.notes[p.num] && S.notes[p.num].t) || "";
  return '<div class="prob' + (s ? " solved" : "") + '" id="p' + p.num + '">' +
    '<div class="prob-h"><button class="chk" data-act="solve" data-n="' + p.num + '" title="' + (s ? "Cleared on " + s.d + " (click to undo)" : "Mark cleared on LeetCode") + '">' + (s ? "✓" : "") + "</button>" +
    '<div class="ptitle"><span class="pnum">#' + p.num + '</span><a href="https://leetcode.com/problems/' + p.slug + '/" target="_blank" rel="noopener">' + esc(p.title) + "</a></div>" +
    tags + ' <span class="pill d' + p.diff + '">' + {E:"Easy",M:"Medium",H:"Hard"}[p.diff] + "</span>" +
    '<span class="small muted" style="min-width:52px;text-align:right">+' + (s ? Math.round(base * (s.a ? 0.6 : 1)) : xpNow) + " XP</span>" +
    (opts.review ? '<button class="btn ok" data-act="review" data-n="' + p.num + '">Re-cleared</button>' : "") +
    '<button class="btn" data-act="tog" data-t="h" data-n="' + p.num + '">Hint</button>' +
    '<button class="btn warn" data-act="tog" data-t="a" data-n="' + p.num + '">' + (S.ap[p.num] || s ? "Approach" : "Approach −40%") + "</button>" +
    '<button class="btn" data-act="tog" data-t="n" data-n="' + p.num + '">Note' + (note ? " •" : "") + "</button></div>" +
    '<div class="reveal" data-r="h"><div class="lab h">Mentor hint</div><p>' + md(p.hint) + "</p></div>" +
    '<div class="reveal" data-r="a"><div class="lab a">Approach</div><p>' + md(p.appr) + '</p><div class="lab j">Java tools</div><p>' + md(p.java) + "</p></div>" +
    '<div class="reveal" data-r="n"><div class="lab n">Your key insight (one line, in your words)</div><textarea data-act="note" data-n="' + p.num + '" placeholder="e.g. prefix sum + map seeded with {0:1}; negatives break sliding window">' + esc(note) + "</textarea></div>" +
    "</div>";
}

function viewToday(){
  const t = todayStr(), day = dayNo(), g = currentGate();
  const pen = penaltyActive();
  const need = pen ? 4 : 3;
  const c = todayCounts(), due = dueList();
  const reviewOk = c.reviews >= 1 || due.length === 0;
  const allOk = c.clears >= need && reviewOk && c.note;
  const claimed = !!S.bonus[t];
  const q = (label, ok, txt) => '<div class="quest"><span>' + label + '</span><span class="' + (ok ? "done" : "todo") + '">' + txt + "</span></div>";

  // next problems: unsolved core problems from all gates up to the current one, earliest first
  const queue = [];
  for (const gg of GATES) {
    if (gg.idx > g.idx) break;
    core(gg).forEach(p => { if (!isSolved(p.num)) queue.push(p); });
  }
  if (queue.length < 4) for (const gg of GATES.slice(g.idx + 1)) { core(gg).forEach(p => { if (!isSolved(p.num) && queue.length < 4) queue.push(p); }); if (queue.length >= 4) break; }
  const next = queue.slice(0, 4);
  const side = g.problems.find(p => p.flag === "side" && !isSolved(p.num));
  const isContestDay = day % 7 === 0;

  let h = "";
  if (pen) h += '<div class="sysmsg penalty"><div class="tag">[ PENALTY QUEST ]</div><p>Yesterday ended with no activity. Today\'s quest requires <b>4</b> clears instead of 3. Missing one day is fine; missing the habit is not.</p></div>';
  h += '<div class="grid2"><div class="win"><div class="win-title">Daily Quest · ' + t + "</div><div class=\"win-body\">" +
    '<p class="muted small">[SYSTEM] Daily Quest: Preparing to become strong. Complete every item for +30 XP.</p>' +
    q("Clear " + need + " new problems", c.clears >= need, Math.min(c.clears, need) + " / " + need) +
    q("Re-clear 1 problem from the Review Queue", reviewOk, due.length === 0 && c.reviews === 0 ? "none due ✓" : Math.min(c.reviews, 1) + " / 1") +
    q("Write a key-insight note on any problem", c.note, c.note ? "1 / 1" : "0 / 1") +
    '<div style="margin-top:12px">' + (claimed ? '<span class="done" style="color:var(--ok);font-family:var(--head);font-weight:700;letter-spacing:.1em">REWARD CLAIMED +30 XP</span>' :
      '<button class="btn ok big" data-act="claim"' + (allOk ? "" : " disabled") + ">Claim reward</button>") + "</div></div></div>" +
    '<div class="win"><div class="win-title">Day ' + Math.min(day, PLAN_DAYS) + " · Gate " + g.idx + "</div><div class=\"win-body\">" +
    '<h2 style="margin:0">' + esc(g.name) + ' <span class="rank" style="color:var(--' + g.rank + ');font-size:15px">' + g.rank + "</span></h2>" +
    '<p class="muted">' + esc(g.sub) + " · Days " + g.days[0] + "–" + g.days[1] + "</p><p>" + md(g.what) + '</p><p style="margin-top:10px"><a class="btn" href="#gate-' + g.id + '" style="text-decoration:none">Open gate lesson and template →</a></p>' +
    (day > PLAN_DAYS ? '<p class="small muted" style="margin-top:8px">The 60-day plan is over. Keep clearing side quests, reviews and contests.</p>' : "") + "</div></div></div>";

  if (isContestDay) h += '<div class="sysmsg"><div class="tag">[ RANK-UP EXAM ]</div><p>Day ' + day + ' is an exam day. Take a LeetCode weekly contest (live or virtual) and log it below. Upsolve the first problem you missed.</p></div>';

  h += '<h3>Today\'s targets</h3><p class="muted small">Unsolved core problems in plan order. Anything from an earlier gate is marked as behind schedule.</p>' +
    (next.length ? next.map(p => problemRow(p, {showGate:true, extra: p.gate.idx < g.idx ? ' <span class="pill" style="color:var(--warn)">BEHIND</span>' : ""})).join("") : '<p class="muted">All core problems cleared up to this gate. Take a side quest or review.</p>') +
    (side ? '<h3>Optional side quest</h3>' + problemRow(side, {showGate:true}) : "");

  h += "<h3>Review Queue (" + due.length + ")</h3>" +
    (due.length ? '<p class="muted small">Solve these again from scratch on LeetCode without looking at your old code, then press Re-cleared (+5 XP). Spaced at 3, 7 and 21 days.</p>' + due.map(x => problemRow(x.p, {showGate:true, review:true, extra:' <span class="small muted">due ' + x.due + "</span>"})).join("") : '<p class="muted">Nothing due today.</p>');

  h += '<h3>Contest log</h3><div class="win"><div class="win-body"><div class="row">' +
    '<input type="text" id="cname" placeholder="e.g. Weekly Contest 476" style="flex:1;min-width:200px">' +
    '<select id="csolved">' + [0,1,2,3,4].map(n => '<option value="' + n + '">' + n + " solved</option>").join("") + "</select>" +
    '<button class="btn" data-act="contest">Log contest (+20, +20 per solve)</button></div>' +
    (S.contests.length ? '<table class="t" style="margin-top:10px"><tr><th>Date</th><th>Contest</th><th>Solved</th><th></th></tr>' +
      S.contests.map((c, i) => ({c, i})).reverse().slice(0, 8).map(({c, i}) => "<tr><td>" + c.d + "</td><td>" + esc(c.name || "Contest") + "</td><td>" + c.n + ' / 4</td><td><button class="btn bad" data-act="delc" data-i="' + i + '">×</button></td></tr>').join("") + "</table>" : "") +
    "</div></div>";
  return h;
}

function viewGates(){
  const cur = currentGate();
  const phases = [[0,4,PHASES[0]],[5,9,PHASES[1]],[10,13,PHASES[2]],[14,19,PHASES[3]]];
  return '<h2>Gates</h2><p class="muted">Twenty gates over 60 days. Each gate has a lesson, a Java template, and problems ordered easiest to hardest, ending in a boss. Side quests are optional. Gates are never locked, but the recommended rank shows how ready you should be.</p>' +
    phases.map(([a, b, ph]) => '<div class="phase">' + ph[0] + " · " + ph[1] + " · target rank " + ph[2] + '</div><div class="grid3">' +
      GATES.slice(a, b + 1).map(g => {
        const total = core(g).length, done = core(g).filter(p => isSolved(p.num)).length;
        const boss = g.problems.find(p => p.flag === "boss");
        const cls = gateCleared(g) ? " cleared" : g === cur ? " current" : "";
        return '<a class="win gate' + cls + '" href="#gate-' + g.id + '"><div class="row" style="justify-content:space-between"><span class="gno">GATE ' + pad(g.idx) + " · DAYS " + g.days[0] + "–" + g.days[1] + '</span><span class="rank" style="color:var(--' + g.rank + ');font-size:14px">' + g.rank + "</span></div>" +
          '<div class="gname">' + esc(g.name) + '</div><div class="gsub">' + esc(g.sub) + "</div>" +
          '<div class="bar"><i style="width:' + Math.round(done / total * 100) + '%"></i></div>' +
          '<div class="row small muted" style="justify-content:space-between"><span>' + done + " / " + total + " core</span><span>" +
          (gateCleared(g) ? '<b style="color:var(--ok)">CLEARED</b>' : g === cur ? '<b style="color:var(--glow2)">ACTIVE</b>' : "") +
          (boss ? " · Boss " + (isSolved(boss.num) ? "☠" : "○") : "") + "</span></div></a>";
      }).join("") + "</div>").join("");
}

function viewGate(id){
  const g = GATES.find(x => x.id === id);
  if (!g) return viewGates();
  const total = core(g).length, done = core(g).filter(p => isSolved(p.num)).length;
  const prev = GATES[g.idx - 1], next = GATES[g.idx + 1];
  return '<p><a href="#gates">← All gates</a></p>' +
    '<div class="win"><div class="win-title">Gate ' + pad(g.idx) + " · Recommended rank " + g.rank + " · Days " + g.days[0] + "–" + g.days[1] + " · Stat " + g.stat + '</div><div class="win-body">' +
    '<h2>' + esc(g.name) + '</h2><p class="muted">' + esc(g.sub) + " · " + done + " / " + total + " core cleared</p>" +
    '<div class="bar" style="margin:8px 0 4px"><i style="width:' + Math.round(done / total * 100) + '%"></i></div>' +
    "<h3>What it is</h3><p>" + md(g.what) + "</p>" +
    '<div class="grid2"><div><h3>Recognise it when</h3><ul class="clean">' + g.signals.map(s => "<li>" + md(s) + "</li>").join("") + "</ul></div>" +
    '<div><h3>Mentor\'s approach</h3><ol class="steps">' + g.steps.map(s => "<li>" + md(s) + "</li>").join("") + "</ol></div></div>" +
    "<h3>Java template</h3>" + codeBlock(g.code) +
    '<h3>Traps</h3><ul class="clean">' + g.traps.map(s => "<li>" + md(s) + "</li>").join("") + "</ul></div></div>" +
    '<h3>Problems</h3><p class="muted small">Open the problem on LeetCode, follow the Mentor Protocol, and tick the box once it is Accepted. Hints are free. Opening the Approach before you clear a problem lowers its XP by 40%.</p>' +
    g.problems.map(p => problemRow(p)).join("") +
    '<div class="row" style="justify-content:space-between;margin-top:18px">' +
    (prev ? '<a class="btn" style="text-decoration:none" href="#gate-' + prev.id + '">← Gate ' + prev.idx + ": " + esc(prev.name) + "</a>" : "<span></span>") +
    (next ? '<a class="btn" style="text-decoration:none" href="#gate-' + next.id + '">Gate ' + next.idx + ": " + esc(next.name) + " →</a>" : "") + "</div>";
}

let QZ = null;
function newQuiz(){
  const order = QUIZ.map((_, i) => i).sort(() => Math.random() - .5);
  QZ = {order, pos:0, score:0, answered:null, opts:null};
  buildOpts();
}
function buildOpts(){
  const q = QUIZ[QZ.order[QZ.pos]];
  const wrong = QUIZ_POOL.filter(x => x !== q[1]).sort(() => Math.random() - .5).slice(0, 3);
  QZ.opts = wrong.concat([q[1]]).sort(() => Math.random() - .5);
  QZ.answered = null;
}
function viewCodex(){
  if (!QZ) newQuiz();
  const qi = QZ.order[QZ.pos], q = QUIZ[qi];
  const done = QZ.pos >= QUIZ.length;
  let quiz;
  if (done) quiz = '<p style="font-size:18px">Trial complete: <b>' + QZ.score + " / " + QUIZ.length + '</b>.</p><button class="btn big" data-act="qrestart">Run the trial again</button>';
  else quiz = '<p class="muted small">Question ' + (QZ.pos + 1) + " / " + QUIZ.length + " · Score " + QZ.score + " · First correct answer per question gives +3 XP (" + Object.keys(S.quiz).length + "/" + QUIZ.length + ' earned)</p><p style="font-size:17px;margin:10px 0"><b>' + md(q[0]) + "</b></p>" +
    QZ.opts.map((o, i) => {
      let cls = "";
      if (QZ.answered !== null) { if (o === q[1]) cls = " right"; else if (i === QZ.answered) cls = " wrong"; }
      return '<button class="btn qopt' + cls + '" data-act="qans" data-i="' + i + '"' + (QZ.answered !== null ? " disabled" : "") + ">" + esc(o) + "</button>";
    }).join("") +
    (QZ.answered !== null ? '<div class="sysmsg"><div class="tag">' + (QZ.opts[QZ.answered] === q[1] ? "[ CORRECT ]" : "[ INCORRECT ]") + "</div><p>" + md(q[2]) + '</p></div><button class="btn big" data-act="qnext">Next</button>' : "");
  return "<h2>Pattern Codex</h2><p class=\"muted\">How many types of problems are there? About 20–30 patterns cover nearly every LeetCode interview problem. The skill is recognising which one a problem is from its wording and constraints. Read the table, then run the trial.</p>" +
    '<div class="win" style="margin-top:12px"><div class="win-title">Gate Identification Trial</div><div class="win-body">' + quiz + "</div></div>" +
    '<h3>If the problem says… think…</h3><div class="scroll"><table class="t"><tr><th>Signal in the problem</th><th>Pattern</th><th>Gate</th></tr>' +
    CODEX.map(r => { const g = GATES.find(x => x.id === r[2]); return "<tr><td>" + md(r[0]) + "</td><td><b>" + esc(r[1]) + '</b></td><td><a href="#gate-' + g.id + '">' + g.idx + " · " + esc(g.name) + "</a></td></tr>"; }).join("") + "</table></div>" +
    '<h3>Constraints tell you the complexity</h3><p class="muted small">Roughly 10⁸ simple operations run in about a second. Read n first and rule out ideas that are too slow.</p><table class="t"><tr><th>Input size</th><th>Target complexity and typical technique</th></tr>' +
    COMPLEXITY.map(r => "<tr><td><b>" + r[0] + "</b></td><td>" + esc(r[1]) + "</td></tr>").join("") + "</table>";
}

function viewArsenal(){
  return '<h2>Java Arsenal</h2><p class="muted">The collections you will use in every gate, when to pick each one, and the mistakes that cost Java users the most time. For the full method-by-method reference, see the Java DSA API Codex in <a href="https://github.com/purvammm/Skill-Upgradation/pull/3" target="_blank" rel="noopener">PR #3</a>.</p>' +
    '<h3>Which collection?</h3><div class="scroll"><table class="t"><tr><th>You need</th><th>Use</th><th>Key methods</th><th>Cost</th></tr>' +
    ARSENAL.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td><td>" + r[3] + "</td></tr>").join("") + "</table></div>" +
    "<h3>Starter kit (Gate 0 template)</h3>" + codeBlock(GATES[0].code) +
    "<h3>Conversions you will type constantly</h3>" + codeBlock(CONVERSIONS) +
    '<h3>Java traps</h3><ul class="clean">' + JAVA_TRAPS.map(s => "<li>" + md(s) + "</li>").join("") + "</ul>" +
    '<h3>Template index</h3><ul class="clean">' + GATES.slice(1).map(g => '<li><a href="#gate-' + g.id + '">Gate ' + g.idx + " · " + esc(g.name) + "</a> — " + esc(g.sub) + "</li>").join("") + "</ul>";
}

function viewMentor(){
  return '<h2>Mentor Protocol</h2><p class="muted">The rules of training. Solving 190 problems badly teaches less than solving 120 with this loop.</p>' +
    '<div class="win" style="margin-top:12px"><div class="win-title">The solve loop · use it on every problem</div><div class="win-body"><ol class="steps">' +
    SOLVE_LOOP.map(s => "<li><b>" + esc(s[0]) + ".</b> " + md(s[1]) + "</li>").join("") + "</ol></div></div>" +
    '<div class="grid2"><div><h3>Edge-case checklist</h3><ul class="clean">' + EDGE_CASES.map(s => "<li>" + esc(s) + "</li>").join("") + "</ul></div>" +
    '<div><h3>Weekly rhythm</h3><table class="t">' + WEEK.map(w => "<tr><td><b>" + w[0] + "</b></td><td>" + esc(w[1]) + "</td></tr>").join("") + "</table></div></div>" +
    '<h3>The 60-day plan</h3><div class="scroll"><table class="t"><tr><th>Phase</th><th>Days</th><th>Rank</th><th>Gates</th><th>Exit test</th></tr>' +
    PHASES.map(p => "<tr><td><b>" + p[0] + "</b></td><td>" + p[1] + "</td><td>" + p[2] + "</td><td>" + p[3] + "</td><td>" + esc(p[4]) + "</td></tr>").join("") + "</table></div>" +
    '<h3>Competitive programming track</h3><ul class="clean">' +
    "<li><b>LeetCode weekly contest</b>: Sundays, usually 02:30 UTC (8:00 AM IST). <b>Biweekly</b>: alternate Saturdays, usually 14:30 UTC (8:00 PM IST). Check the <a href=\"https://leetcode.com/contest/\" target=\"_blank\" rel=\"noopener\">contest page</a> for current times. Missed one? Use Virtual Contest.</li>" +
    "<li>Contest goals: Phase 1–2 solve Q1–Q2, Phase 3 solve Q3, Phase 4 attempt Q4. Upsolve one missed problem after every contest.</li>" +
    "<li><b>Optional Codeforces ladder</b> (3 problems a week, Div. 3 / Div. 4 rounds): weeks 1–2 rating " + cf("800-1000") + ", weeks 3–4 " + cf("1000-1200") + ", weeks 5–6 " + cf("1200-1400") + ", weeks 7–8 " + cf("1400-1600") + ". Use the fast I/O template in <a href=\"#gate-g19\">Gate 19</a>.</li></ul>" +
    '<h3>A straight word from your mentor</h3><p>Advanced level in two months is aggressive: about 190 problems at roughly 3 a day. If you fall behind, drop side quests first. Never drop the Review Queue; re-solving from memory is what makes patterns stick. Stuck is the training. Read the hint only after you have actually been stuck.</p>';
}
function cf(r){ return '<a href="https://codeforces.com/problemset?tags=' + r + '" target="_blank" rel="noopener">' + r + "</a>"; }

function viewSystem(){
  return '<h2>System</h2><div class="win"><div class="win-body">' +
    '<div class="row"><label>Plan start date (Day 1): <input type="date" id="sdate" value="' + S.start + '"></label><button class="btn" data-act="setstart">Save</button></div>' +
    '<p class="muted small" style="margin-top:6px">Changing the start date moves today\'s gate. It does not change any cleared problems.</p>' +
    '<h3>Backup</h3><div class="row"><button class="btn" data-act="export">Export progress (JSON)</button>' +
    '<label class="btn" style="display:inline-block">Import progress<input type="file" id="imp" accept="application/json" style="display:none"></label></div>' +
    '<p class="muted small">Progress lives in this browser only. Export regularly if you switch devices or clear browser data.</p>' +
    '<h3>XP rules</h3><table class="t"><tr><td>Easy / Medium / Hard clear</td><td>10 / 25 / 50 XP (60% if you opened the Approach first)</td></tr>' +
    "<tr><td>Review Queue re-clear</td><td>5 XP each, at 3, 7 and 21 days</td></tr><tr><td>Daily Quest reward</td><td>30 XP</td></tr>" +
    "<tr><td>Pattern trial, first correct answer</td><td>3 XP per question</td></tr><tr><td>Contest logged</td><td>20 XP + 20 per problem solved</td></tr>" +
    "<tr><td>Level</td><td>Level L needs 3·(L−1)² XP. Ranks: E 1–9, D 10–19, C 20–29, B 30–39, A 40–49, S 50+</td></tr>" +
    "<tr><td>Title “Shadow Monarch”</td><td>Defeat every gate boss</td></tr></table>" +
    '<h3>Danger zone</h3><button class="btn bad" data-act="reset">Reset all progress</button></div></div>';
}

function render(){
  CODE_BLOCKS = [];
  renderStatus();
  const h = (location.hash || "#today").slice(1);
  const tab = h.startsWith("gate-") ? "gates" : h;
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  const v = $("#view");
  const open = [...v.querySelectorAll(".reveal.open")].map(el => el.closest(".prob").id + ":" + el.dataset.r);
  if (h.startsWith("gate-")) v.innerHTML = viewGate(h.slice(5));
  else v.innerHTML = ({today:viewToday, gates:viewGates, codex:viewCodex, arsenal:viewArsenal, mentor:viewMentor, system:viewSystem}[h] || viewToday)();
  open.forEach(k => { const [pid, r] = k.split(":"); v.querySelectorAll("#" + pid + ' .reveal[data-r="' + r + '"]').forEach(el => el.classList.add("open")); });
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, n = b.dataset.n;
  if (act === "tog") {
    const box = b.closest(".prob").querySelector('.reveal[data-r="' + b.dataset.t + '"]');
    if (b.dataset.t === "a" && !box.classList.contains("open") && !S.solved[n] && !S.ap[n]) {
      S.ap[n] = true; save();
      b.textContent = "Approach";
      toast("<b>[SYSTEM]</b> Approach revealed. Clearing #" + n + " now gives 60% XP.");
    }
    box.classList.toggle("open");
    if (b.dataset.t === "n" && box.classList.contains("open")) box.querySelector("textarea").focus();
  } else if (act === "solve") {
    if (S.solved[n]) {
      if (!confirm("Undo the clear for #" + n + "? Its XP and review history will be removed.")) return;
      delete S.solved[n];
    } else {
      const p = PMAP[n];
      S.solved[n] = {d:todayStr(), a:!!S.ap[n], r:[]};
      const xp = Math.round(XPV[p.diff] * (S.ap[n] ? 0.6 : 1));
      toast("<b>[SYSTEM]</b> Quest cleared: " + esc(p.title) + ". +" + xp + " XP");
      if (p.flag === "boss") toast("<b>[SYSTEM]</b> Boss defeated in Gate " + p.gate.idx + ".");
      if (gateCleared(p.gate)) toast("<b>[SYSTEM]</b> Gate " + p.gate.idx + " · " + esc(p.gate.name) + " cleared.");
    }
    commit();
  } else if (act === "review") {
    S.solved[n].r = (S.solved[n].r || []).concat([todayStr()]);
    toast("<b>[SYSTEM]</b> Re-clear recorded. +5 XP");
    commit();
  } else if (act === "claim") {
    S.bonus[todayStr()] = true;
    toast("<b>[SYSTEM]</b> Daily Quest complete. +30 XP");
    commit();
  } else if (act === "contest") {
    S.contests.push({d:todayStr(), name:$("#cname").value.trim().slice(0, 80), n:+$("#csolved").value});
    toast("<b>[SYSTEM]</b> Contest logged.");
    commit();
  } else if (act === "delc") {
    if (confirm("Delete this contest entry?")) { S.contests.splice(+b.dataset.i, 1); commit(); }
  } else if (act === "copy") {
    navigator.clipboard && navigator.clipboard.writeText(CODE_BLOCKS[+b.dataset.i]).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); });
  } else if (act === "qans") {
    if (QZ.answered !== null) return;
    QZ.answered = +b.dataset.i;
    const qi = QZ.order[QZ.pos];
    if (QZ.opts[QZ.answered] === QUIZ[qi][1]) { QZ.score++; if (!S.quiz[qi]) { S.quiz[qi] = true; toast("<b>[SYSTEM]</b> Pattern identified. +3 XP"); } }
    commit();
  } else if (act === "qnext") {
    QZ.pos++; if (QZ.pos < QUIZ.length) buildOpts(); render();
  } else if (act === "qrestart") {
    newQuiz(); render();
  } else if (act === "close-ov") {
    b.closest(".overlay").remove();
  } else if (act === "setstart") {
    const v = $("#sdate").value;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { S.start = v; commit(); toast("<b>[SYSTEM]</b> Start date updated."); }
  } else if (act === "export") {
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dsa-solo-leveling-progress-" + todayStr() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  } else if (act === "reset") {
    if (confirm("Reset ALL progress? This cannot be undone.") && confirm("Really reset? Consider exporting first.")) { S = freshState(); commit(); }
  }
});

let noteTimer = null;
document.addEventListener("input", e => {
  if (e.target.id === "hname") { S.name = e.target.value.slice(0, 40); save(); return; }
  if (e.target.dataset.act === "note") {
    const n = e.target.dataset.n, val = e.target.value.slice(0, 2000);
    S.notes[n] = {t:val, d:todayStr()};
    save();
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => renderStatus(), 400);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "imp" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (typeof data !== "object" || !data || typeof data.solved !== "object") throw new Error("bad file");
        S = Object.assign(freshState(), data);
        commit();
        toast("<b>[SYSTEM]</b> Progress imported.");
      } catch(err) { alert("That file is not a valid progress export."); }
    };
    r.readAsText(e.target.files[0]);
  }
  if (e.target.dataset && e.target.dataset.act === "note") render();
});
window.addEventListener("hashchange", () => { render(); window.scrollTo({top: document.getElementById("tabs").offsetTop, behavior:"smooth"}); });

S.lv = Math.max(S.lv || 1, levelOf(computeXP()));
save();
render();
if (!localStorage.getItem(KEY + "-welcomed")) {
  localStorage.setItem(KEY + "-welcomed", "1");
  overlay('<div style="font-family:var(--head);letter-spacing:.3em;color:var(--glow2)">[ SYSTEM ]</div><div class="big" style="font-size:30px">You have been chosen</div>' +
    '<p style="margin-top:10px">You have acquired the qualifications to be a Player. Sixty days, twenty gates, about ' + ALL.length + " LeetCode problems in Java.</p>" +
    '<p class="muted small" style="margin-top:8px">Start with the Mentor Protocol tab, then open Gate 0. Today is Day 1.</p>');
}
</script>
</body>
</html>
